# Run the unit tests on every push. No deployment.
# The unit tests use a synthetic index and a fake embedder, so no model download or API key is needed.
# The integration test needs the lyric metadata (private data repository) and skips here.
# search.py imports sentence-transformers, so torch is installed first from the CPU-only index.
name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
