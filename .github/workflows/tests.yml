# Run the unit tests on every push. No deployment.
# The unit tests use a synthetic index and a fake embedder, so no model download or API key is needed.
# The integration test needs the lyric metadata (private data repository) and skips here.
# search.py imports sentence-transformers, so torch is installed first from the CPU-only index.
# Steps come from the shared reusable workflows in fairyofdata/Concordia.
name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: fairyofdata/Concordia/.github/workflows/python-tests.yml@v1
    with:
      python-versions: '["3.12"]'
      install: |
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements.txt -r requirements-dev.txt
      test: python -m pytest -q

  hygiene:
    uses: fairyofdata/Concordia/.github/workflows/hygiene.yml@v1
